<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab do Meu Negócio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de celular em coluna única; no computador vira um aparelho centralizado. Painel em cards, abas embaixo. */
:root{
  --bg:#eef2ef; --phone:#f9fbfa; --card:#ffffff; --ink:#16231e; --muted:#5d6d66; --line:#dfe7e3;
  --green:#1d6b52; --green-soft:#e1f0e9; --orange:#b4521b; --orange-soft:#f9eadf; --sun:#9a7208; --sun-soft:#f8efd5;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b100e; --phone:#111816; --card:#18211e; --ink:#e4ece8; --muted:#97a8a0; --line:#26332e;
  --green:#5cc89c; --green-soft:#17322a; --orange:#ee935d; --orange-soft:#3a2417; --sun:#e2b752; --sun-soft:#352b13; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0b100e; --phone:#111816; --card:#18211e; --ink:#e4ece8; --muted:#97a8a0; --line:#26332e;
  --green:#5cc89c; --green-soft:#17322a; --orange:#ee935d; --orange-soft:#3a2417; --sun:#e2b752; --sun-soft:#352b13; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.phone{max-width:430px;margin:0 auto;min-height:100%;background:var(--phone);position:relative;display:flex;flex-direction:column}
@media (min-width:600px){ body{padding-block:28px} .phone{border-radius:28px;box-shadow:0 18px 50px rgba(20,40,30,.14);overflow:hidden;min-height:820px} }
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(18px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px));padding-top:max(14px,env(safe-area-inset-top,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.brand i{font-style:normal;color:var(--green)}
.proto{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
main{flex:1;padding:6px max(18px,env(safe-area-inset-right,0px)) 110px max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.85rem;line-height:1.1}
h2{font-size:1.3rem;line-height:1.2}
h3{font-size:1.02rem;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.84rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px;min-width:0}
.card.hero{background:var(--green);color:#fff;border:0}
.card.hero .muted{color:rgba(255,255,255,.82)}
.card.sunbox{background:var(--sun-soft);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--green-soft);color:var(--green);width:max-content;max-width:100%}
.chip.warn{background:var(--orange-soft);color:var(--orange)} .chip.sun{background:var(--sun-soft);color:var(--sun)}
.hero .chip{background:rgba(255,255,255,.18);color:#fff}
.big{font-family:var(--f-display);font-weight:700;font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:1rem;font-weight:500;letter-spacing:0}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.bar>span{display:block;height:100%;background:#fff;border-radius:999px;transition:width .5s}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.scen{display:grid;gap:8px}
.scen .line{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.track{height:12px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.track span{position:absolute;top:0;bottom:0;border-radius:6px}
.scen b{font-variant-numeric:tabular-nums;font-weight:600;min-width:84px;text-align:right}
.pos{color:var(--green)} .neg{color:var(--orange)}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.meter i.on{background:var(--orange)} .meter i.g{background:var(--green)}
.people{display:flex;gap:5px;align-items:flex-end}
.people svg{width:22px;height:30px}
.people .on{fill:var(--green)} .people .off{fill:var(--line)}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--green);color:#fff;width:100%;text-align:center}
button:disabled{opacity:.45;cursor:default}
button.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
button.link{background:none;color:var(--green);padding:6px 0;width:auto;text-align:left}
button.hero-btn{background:#fff;color:var(--green)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);text-align:left;display:grid;gap:2px;padding:14px}
.opt small{color:var(--muted);font-weight:400}
.opt.sel{border-color:var(--green);background:var(--green-soft)}
.opt svg{width:26px;height:26px;stroke:var(--green);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.95rem}
.field .hint{font-size:.8rem;color:var(--muted)}
.money{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:0 14px}
.money span{color:var(--muted);font-weight:600}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;width:100%}
.money input{border:0;padding-left:8px;background:transparent;font-variant-numeric:tabular-nums}
textarea{min-height:96px;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.search input{padding-left:44px;font-size:1.05rem}
.results{display:grid;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.results button{background:none;color:var(--ink);border-radius:0;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:500;display:flex;justify-content:space-between;gap:10px}
.results button:last-child{border-bottom:0}
.results button small{color:var(--muted);font-weight:400}
.results button mark{background:var(--sun-soft);color:inherit;border-radius:3px;padding:0 1px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--green)}
.back{background:none;color:var(--muted);padding:0;width:auto;font-weight:500;justify-self:start}
.counter{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.counter:last-child{border-bottom:0}
.counter .n{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.plus{display:flex;gap:6px}
.plus button{width:46px;height:46px;padding:0;border-radius:50%;font-size:1.3rem}
.mission{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:#fff;flex:none}
.check.ok{background:var(--green);border-color:var(--green)}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:5}
@media (min-width:600px){.tabbar{position:absolute;left:0;transform:none;border-radius:0 0 28px 28px}}
.tabbar[hidden]{display:none}
.tabbar button{background:none;color:var(--muted);border-radius:0;padding:10px 4px 6px;display:grid;justify-items:center;gap:3px;font-size:.74rem;font-weight:600}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--green)}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start}
.num-dot{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sun-soft);color:var(--sun);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--phone);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--phone);border-radius:12px;padding:10px;display:grid;gap:2px;align-content:start;min-width:0}
.mini b{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.mini span{font-size:.78rem;color:var(--muted)}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.path{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;align-content:start}
.path.rec{border-color:var(--green);background:var(--green-soft)}
.path h3{font-size:.95rem}
.path p{font-size:.82rem}
.path .tag{font-size:.7rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em}
.modules{display:grid;gap:8px}
.module{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--phone)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  // ============ painel
  function painel(){
    const neg = NEGID[S.neg] || NEG[0], r = contas(), cl = clareza(), cid = cidadeDados(S.uf, S.mun, neg), ms = missoesStatus(), prox = ms.find(m => !m.feito);
    let h = '';
    if (S.exemplo) h += `<div class="card sunbox"><p class="small"><b>Este é um exemplo</b> de uma lanchonete, para você ver como funciona.</p><button data-acao="comecar">Testar a minha ideia</button></div>`;
    h += `<div class="card hero"><span class="chip">${esc(neg.nome)} · ${esc(S.mun)}, ${S.uf}</span>
      <div class="row"><h2>Clareza da sua ideia</h2><span class="big">${cl}<small>%</small></span></div>
      <div class="bar" role="progressbar" aria-valuenow="${cl}" aria-valuemin="0" aria-valuemax="100"><span style="width:${cl}%"></span></div>
      <p class="small muted">Mostra quanto você já pesquisou, não se a ideia é boa.</p></div>`;

    // cidade
    const ficam = Math.round(cid.sobrev / 10), ficamUF = Math.round(cid.sobrevEstado / 10);
    h += `<div class="card"><div class="row"><h3>${esc(neg.nome)} em ${esc(S.mun)}</h3><span class="chip sun">exemplo</span></div>
      <div class="split"><div class="mini"><b>${int(cid.existem)}</b><span>funcionando hoje</span></div><div class="mini"><b>+${cid.abriram} <span style="color:var(--orange);font-size:1.3rem">−${cid.fecharam}</span></b><span>abriram e fecharam no último ano</span></div></div>
      ${cid.poucos ? `<p class="small muted">Poucos negócios assim na cidade para medir quantos ficam. Usamos o número do estado.</p>` : ''}
      <p>De cada 10 que abrem, <b>${cid.poucos ? ficamUF : ficam}</b> continuam abertos depois de 2 anos${cid.poucos ? ' no estado' : ''}.</p>${pessoas(cid.poucos ? ficamUF : ficam)}
      ${cid.poucos ? '' : `<p class="small muted">No estado todo: ${ficamUF} de cada 10.</p>`}
      <button class="link" data-aba="pensar">O que vai fazer você estar entre os que ficam? →</button></div>`;

    if (!r.ok) return h + `<div class="card"><h3>Falta pouco</h3><p class="muted">${r.margem <= 0 && S.num.gasto ? 'Cada venda está custando mais do que você cobra. Revise o preço ou o custo de cada venda.' : 'Preencha os números do negócio para ver as contas.'}</p><button data-go="numeros">Ajustar meus números</button></div>`;

    const eq = r.equilibrio, cli = n(S.num.clientes), folga = cli / eq;
    h += `<div class="card"><span class="chip ${folga < 1 ? 'warn' : ''}">${folga < 1 ? 'Atenção' : 'A conta fecha'}</span>
      <h3>Para não ter prejuízo, você precisa de</h3><div class="big">${int(Math.ceil(eq))} <small>clientes por dia</small></div>
      <p class="muted small">Você espera ${int(cli)}. ${folga >= 1 ? `Sobra uma folga de ${int(cli - eq)} por dia.` : `Faltam ${int(eq - cli)} por dia para empatar.`}</p>`;
    if (r.passantes) h += `<div class="mini"><span>Pela sua contagem, passam cerca de ${int(r.passantes)} pessoas por dia no ponto.</span><b>${deCem(eq / r.passantes * 100)} de cada 100</b><span>precisam entrar e comprar para você empatar.</span></div>`;
    else h += `<button class="link" data-aba="missoes">Conte o movimento do ponto para ver quantas pessoas precisam entrar →</button>`;
    h += `</div>`;

    const mx = Math.max(Math.abs(r.fraco), Math.abs(r.normal), Math.abs(r.bom)) || 1;
    const barra = v => `<div class="track"><span style="left:${v >= 0 ? 50 : 50 - Math.abs(v)/mx*50}%;width:${Math.abs(v)/mx*50}%;background:var(${v >= 0 ? '--green' : '--orange'})"></span></div>`;
    h += `<div class="card"><h3>Quanto pode sobrar por mês para você</h3><p class="small muted">Depois que o negócio pegar ritmo e já descontadas todas as contas.</p><div class="scen">
      <div class="line"><span>Mês fraco</span>${barra(r.fraco)}<b class="${r.fraco < 0 ? 'neg' : 'pos'}">${brl(r.fraco)}</b></div>
      <div class="line"><span><b style="min-width:0;text-align:left">Mês normal</b></span>${barra(r.normal)}<b class="${r.normal < 0 ? 'neg' : 'pos'}">${brl(r.normal)}</b></div>
      <div class="line"><span>Mês bom</span>${barra(r.bom)}<b class="${r.bom < 0 ? 'neg' : 'pos'}">${brl(r.bom)}</b></div></div>
      <p class="small muted">Estimativa com base nas suas respostas. Não é garantia.</p></div>`;

    // CLT
    if (S.perfil.clt === 'sim' && n(S.perfil.salario) > 0){
      const sal = n(S.perfil.salario), mesesReserva = {'0-3':2,'3-6':4,'6-12':9,'12+':12}[S.perfil.meses] || 0;
      const seguro = r.chanceSalario >= .6 && mesesReserva >= 6;
      h += `<div class="card"><h3>E o seu salário?</h3>
        <p>Para o negócio pagar os seus <b>${brl(sal)}</b> por mês, você precisaria de <b>${int(Math.ceil(r.paraSalario))} clientes por dia</b>.</p>
        <div class="mini"><span>Chance de o negócio pagar o seu salário depois de pegar ritmo</span><b>${int(r.chanceSalario * 100)} em 100</b><div class="meter" aria-hidden="true">${[...Array(10)].map((_, i) => `<i class="${i < Math.round(r.chanceSalario * 10) ? 'g' : ''}"></i>`).join('')}</div></div>
        <div class="paths">
          <div class="path ${!seguro ? 'rec' : ''}">${!seguro ? '<span class="tag">Mais seguro agora</span>' : ''}<h3>Tocar os dois</h3><p>Mantém o emprego e começa o negócio menor ou em horários alternativos. Seu salário segue pagando a casa enquanto o negócio prova que funciona.</p></div>
          <div class="path ${seguro ? 'rec' : ''}">${seguro ? '<span class="tag">Possível</span>' : ''}<h3>Largar a CLT</h3><p>Exige o negócio pagando ${brl(sal)} por mês e reserva para pelo menos 6 meses. Hoje suas contas aguentam ${mesesReserva ? 'cerca de ' + mesesReserva + ' meses' : 'pouco tempo'}.</p></div>
        </div><button class="link" data-aba="escola">Como sair da CLT com um plano →</button></div>`;
    }

    const g = n(S.perfil.guardado), falta = r.bolso - g;
    h += `<div class="card"><span class="chip ${falta > 0 ? 'warn' : ''}">${falta > 0 ? 'Dinheiro curto' : 'Dinheiro suficiente'}</span>
      <h3>Para abrir e aguentar até o negócio andar sozinho, você precisa ter</h3><div class="big">${brl(r.bolso)}</div>
      <p class="small muted">${g ? (falta > 0 ? `Você tem ${brl(g)}. Faltam ${brl(falta)}.` : `Você tem ${brl(g)}. Sobra ${brl(-falta)}.`) : ''} Para ficar tranquilo mesmo em meses ruins: ${brl(r.bolsoFolga)}.</p>
      <div class="split"><div class="mini"><span>O dinheiro investido volta em</span><b>${r.voltaMes > 36 ? 'mais de 3 anos' : int(r.voltaMes) + ' meses'}</b><span>no cenário mais provável</span></div>
      <div class="mini"><span>Chance de, depois de 1 ano, ainda estar mais de ${brl(n(S.perfil.limite))} no prejuízo</span><b class="${r.riscoLimite > .2 ? 'neg' : ''}">${r.riscoLimite === null ? '—' : int(r.riscoLimite * 100) + ' em 100'}</b></div></div></div>`;
    h += `<div class="card"><h3>O que mais pesa na sua conta</h3><p><b>${r.pesa}.</b> É aqui que vale pesquisar mais antes de gastar qualquer dinheiro.</p></div>`;
    if (prox) h += `<div class="card"><div class="row" style="justify-content:flex-start"><span class="num-dot">1</span><h3>Seu próximo passo</h3></div><p>${prox.titulo}. <span class="muted">${prox.sub}.</span></p><button class="ghost" data-aba="missoes">Fazer agora</button></div>`;
    h += `<div class="card hero"><h3>Aprenda os primeiros passos com quem já abriu</h3><p class="small muted">Na Escola de Empreendedores você monta seu plano com outros que estão no mesmo caminho.</p><button class="hero-btn" data-aba="escola">Conhecer a Escola</button></div>`;
    h += `<button class="ghost" data-go="numeros">Ajustar meus números</button>`;
    return h;
  }

  function missoes(){
    const M = S.missoes, ct = M.contagem, cv = M.conversas;
    const contador = (k, rot) => `<div class="counter"><div><b>${rot}</b><div class="small muted">pessoas em 30 minutos</div></div><div class="row"><span class="n">${ct[k]}</span><div class="plus"><button class="ghost" data-menos="contagem.${k}" aria-label="Menos uma em ${rot}">−</button><button data-mais="contagem.${k}" aria-label="Mais uma em ${rot}">+</button></div></div></div>`;
    const conv = (k, rot) => `<div class="counter"><b>${rot}</b><div class="row"><span class="n">${cv[k]}</span><div class="plus"><button class="ghost" data-menos="conversas.${k}" aria-label="Menos uma: ${rot}">−</button><button data-mais="conversas.${k}" aria-label="Mais uma: ${rot}">+</button></div></div></div>`;
    return `<h1>Missões de campo</h1><p class="muted">Você faz a pesquisa na rua; o painel faz as contas.</p>
      <div class="card">${missoesStatus().map(m => `<div class="mission"><span class="check ${m.feito ? 'ok' : ''}">${m.feito ? '✓' : ''}</span><div><b>${m.titulo}</b><div class="small muted">${m.sub}</div></div></div>`).join('')}</div>
      <div class="card"><h3>1. Conte o movimento</h3><p class="small muted">Fique em frente ao ponto e toque no + a cada pessoa que passar a pé.</p>${contador('manha','Manhã')}${contador('almoco','Almoço')}${contador('tarde','Fim de tarde')}</div>
      <div class="card"><h3>2. Visite 3 concorrentes</h3><p class="small muted">Anote o preço de um item parecido com o seu e como está o movimento.</p>
        ${M.concorrentes.map((c, i) => `<div class="row small"><span>Concorrente ${i + 1}</span><span>${brl(c.preco)} · movimento ${esc(c.movimento)}</span></div>`).join('')}
        ${M.concorrentes.length < 3 ? `<div class="split"><div class="money"><span>R$</span><input id="conc-preco" inputmode="numeric" placeholder="preço"></div><select id="conc-mov" aria-label="Movimento"><option>fraco</option><option selected>médio</option><option>forte</option></select></div><button class="ghost" data-acao="addConc">Registrar visita</button>` : ''}</div>
      <div class="card"><h3>3. Converse com 10 possíveis clientes</h3><p class="small muted">Explique sua ideia em uma frase e pergunte: "você compraria?"</p>${conv('sim','Compraria com certeza')}${conv('talvez','Talvez')}${conv('nao','Não compraria')}</div>
      <div class="card"><h3>4. Cote o aluguel de verdade</h3>${M.aluguel.map((v, i) => `<div class="row small"><span>Ponto ${i + 1}</span><span>${brl(v)} por mês</span></div>`).join('')}
        <div class="money"><span>R$</span><input id="alug" inputmode="numeric" placeholder="valor do aluguel"></div><button class="ghost" data-acao="addAlug">Registrar cotação</button></div>`;
  }

  function pensar(){
    const P = S.pensar, neg = NEGID[S.neg] || NEG[0], cid = cidadeDados(S.uf, S.mun, neg), r = contas(), ficam = Math.round((cid.poucos ? cid.sobrevEstado : cid.sobrev) / 10);
    let h = `<h1>Pense como quem já abriu</h1><p class="muted">Quatro perguntas que separam um sonho de um plano.</p>`;
    h += `<div class="card"><span class="chip sun">Imagine o pior</span><h3>Daqui a 1 ano o negócio fechou. Qual foi o motivo mais provável?</h3><div class="opts">
      ${Object.entries(PREMORTEM).map(([k, [rot]]) => opt('pensar.premortem', k, rot, '', P.premortem === k)).join('')}</div>
      ${P.premortem ? `<div class="mini"><span>Um teste barato para esse risco</span><p>${PREMORTEM[P.premortem][1]}</p></div>` : ''}</div>`;
    h += `<div class="card"><span class="chip sun">Olhe de fora</span><h3>De cada 10 negócios como o seu, ${ficam} continuam abertos depois de 2 anos. O que faz você acreditar que estará entre eles?</h3>${pessoas(ficam)}
      <textarea id="porque" data-txt="pensar.porque" placeholder="Escreva com suas palavras">${esc(P.porque)}</textarea></div>`;
    if (r.ok && r.passantes){ const quer = n(S.num.clientes) / r.passantes * 100;
      h += `<div class="card"><span class="chip sun">Confira o otimismo</span><h3>Você espera ${int(n(S.num.clientes))} clientes por dia.</h3><p>Isso quer dizer que ${deCem(quer)} de cada 100 pessoas que passam no ponto vão entrar e comprar${r.simDe10 !== null ? `. Nas suas conversas, ${int(r.simDe10)} de cada 10 disseram que comprariam com certeza` : ''}. Parece realista para você?</p><button class="ghost" data-go="numeros">Revisar clientes por dia</button></div>`; }
    const pa = P.parada;
    h += `<div class="card"><span class="chip sun">Combine com você mesmo</span><h3>Decida agora quando parar ou mudar</h3><p class="small muted">Quem define isso antes decide melhor depois, sem o calor do momento.</p>
      <div class="field"><label for="par-meses">Se em</label><select id="par-meses" data-sel="pensar.parada.meses">${['3','6','9','12'].map(v => `<option value="${v}" ${pa.meses===v?'selected':''}>${v} meses</option>`).join('')}</select></div>
      <div class="field"><label for="par-cli">eu não chegar a quantos clientes por dia</label><input id="par-cli" inputmode="numeric" data-txt="pensar.parada.clientes" value="${esc(pa.clientes)}" placeholder="${r.equilibrio ? int(Math.ceil(r.equilibrio)) : ''}"></div>
      <div class="field"><label for="par-acao">eu vou</label><select id="par-acao" data-sel="pensar.parada.acao">${[['ajustar','mudar o que não está funcionando'],['pausar','pausar e rever o plano'],['encerrar','encerrar antes de perder mais']].map(([v, l]) => `<option value="${v}" ${pa.acao===v?'selected':''}>${l}</option>`).join('')}</select></div></div>`;
    h += `<div class="card"><span class="chip sun">Para você do futuro</span><h3>Por que estou decidindo isso hoje?</h3><textarea id="diario" data-txt="pensar.diario" placeholder="Releia daqui a 3 e 6 meses">${esc(P.diario)}</textarea></div>`;
    return h;
  }

  function escola(){
    const r = contas(), cl = clareza(), pa = S.pensar.parada, g = n(S.perfil.guardado);
    const itens = [[cl >= 80, 'Clareza da ideia acima de 80%', `hoje: ${cl}%`], [!!S.pensar.premortem, 'Imaginei o pior e escolhi um teste para ele', ''],
      [!!S.pensar.porque.trim(), 'Sei por que vou estar entre os que ficam', ''], [!!pa.clientes, 'Combinei quando parar ou mudar', pa.clientes ? `${pa.meses} meses, ${pa.clientes} clientes por dia` : ''],
      [r.ok && g >= r.bolso, 'Tenho dinheiro para aguentar o começo', r.ok ? `preciso de ${brl(r.bolso)}, tenho ${brl(g)}` : '']];
    const prontos = itens.filter(i => i[0]).length;
    const mods = [['Valide antes de gastar','as missões de campo, passo a passo'],['Abra do jeito certo','MEI ou empresa, alvará e o que ninguém conta'],['Preço que dá lucro','quanto cobrar para sobrar dinheiro'],['Os primeiros 100 clientes','vizinhança, WhatsApp e Instagram'],['Controle o caixa','o que olhar toda semana'],['Hora de largar a CLT?','o número que diz quando é seguro']];
    return `<h1>Seu plano e a Escola</h1>
      <div class="card"><h3>Antes de investir: ${prontos} de ${itens.length} prontos</h3><ul class="list">${itens.map(([ok, t, s]) => `<li><span class="check ${ok ? 'ok' : ''}">${ok ? '✓' : ''}</span><div><b>${t}</b>${s ? `<div class="small muted">${s}</div>` : ''}</div></li>`).join('')}</ul></div>
      <div class="card hero"><span class="chip">Escola de Empreendedores</span><h2>Do primeiro passo ao seu próprio negócio</h2><p class="small muted">Aulas curtas, comunidade de quem está no mesmo caminho e o seu painel do Lab acompanhando cada etapa.</p></div>
      <div class="card"><h3>Primeiros passos</h3><div class="modules">${mods.map(([t, s], i) => `<div class="module"><span class="num-dot">${i + 1}</span><div><b>${t}</b><div class="small muted">${s}</div></div></div>`).join('')}</div>
      <button data-acao="vaga">Quero minha vaga</button><p class="small muted" id="vaga-msg"></p></div>
      ${S.perfil.clt === 'sim' ? `<div class="card"><span class="chip">Você está na CLT</span><h3>O caminho mais seguro</h3><ul class="list small"><li><span class="num-dot">1</span>Teste a ideia em pequeno, em horários alternativos.</li><li><span class="num-dot">2</span>Anote quanto sobra de verdade, mês a mês.</li><li><span class="num-dot">3</span>Saia quando o negócio pagar suas contas por 3 meses seguidos e a reserva estiver guardada.</li></ul></div>` : ''}
      <button class="ghost" data-acao="comecar">Testar outra ideia</button>`;
  }

  const ABAS = [
    ['painel','Painel','<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>'],
    ['missoes','Missões','<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'],
    ['pensar','Pensar','<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'],
    ['escola','Escola','<path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5"/>']
  ];
  function render(){
    if (S.etapa !== 'app'){ app.innerHTML = ETAPAS[S.etapa](); tabbar.hidden = true; }
    else { tabbar.hidden = false; app.innerHTML = {painel, missoes, pensar, escola}[S.aba]();
      tabbar.innerHTML = ABAS.map(([k, rot, ic]) => `<button class="${S.aba === k ? 'on' : ''}" data-aba="${k}" aria-current="${S.aba === k ? 'page' : 'false'}"><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg>${rot}</button>`).join(''); }
    salvar();
  }
  const setPath = (p, v) => { const ks = p.split('.'); let o = S; ks.slice(0, -1).forEach(k => o = o[k]); o[ks.at(-1)] = v; };
  const getPath = p => p.split('.').reduce((o, k) => o[k], S);
  let tt; const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1900); };
  const topo = () => window.scrollTo(0, 0);

  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return; const d = b.dataset;
    if (d.set){ setPath(d.set, d.val); render(); return; }
    if (d.go){ S.etapa = d.go; if (d.go === 'app') S.aba = 'painel'; render(); topo(); return; }
    if (d.aba){ S.etapa = 'app'; S.aba = d.aba; render(); topo(); return; }
    if (d.mun){ S.mun = d.mun; S.buscaMun = d.mun; render(); return; }
    if (d.cat){ S.catAberta = S.catAberta === d.cat ? '' : d.cat; render(); return; }
    if (d.neg){ if (S.neg !== d.neg){ S.num = {gasto:'', custo:'', fixas:'', abrir:'', clientes:''}; S.verNumeros = false; } S.neg = d.neg; S.etapa = 'perfil'; render(); topo(); return; }
    if (d.mais || d.menos){ const p = 'missoes.' + (d.mais || d.menos), antes = clareza(); setPath(p, Math.max(0, getPath(p) + (d.mais ? 1 : -1))); render(); const agora = clareza(); if (agora > antes && Math.floor(agora / 10) > Math.floor(antes / 10)) toast('Sua clareza subiu para ' + agora + '%'); return; }
    if (d.acao === 'comecar'){ S = vazio(); render(); topo(); return; }
    if (d.acao === 'verNumeros'){ S.verNumeros = true; render(); topo(); return; }
    if (d.acao === 'tipicos' || d.acao === 'tipicos-com-ajustes'){ const x = NEGID[S.neg] || NEG[0], f = PORTES[S.porte || 'medio'][1], base = {gasto:x.gasto, custo:x.custo, fixas:Math.round(x.fixas * f.fixas), abrir:Math.round(x.abrir * f.abrir), clientes:Math.round(x.clientes * f.clientes * 10) / 10};
      Object.keys(base).forEach(k => { if (S.num[k] === '' || S.num[k] == null) S.num[k] = base[k]; }); S.etapa = 'app'; S.aba = 'painel'; render(); topo(); return; }
    if (d.acao === 'addConc'){ const p = n(document.getElementById('conc-preco').value.replace(/\D/g, '')); if (!p){ toast('Informe o preço que você viu'); return; } S.missoes.concorrentes.push({preco:p, movimento:document.getElementById('conc-mov').value}); render(); toast('Visita registrada. Clareza: ' + clareza() + '%'); return; }
    if (d.acao === 'addAlug'){ const v = n(document.getElementById('alug').value.replace(/\D/g, '')); if (!v){ toast('Informe o valor do aluguel'); return; } S.missoes.aluguel.push(v); render(); toast('Cotação registrada. Clareza: ' + clareza() + '%'); return; }
    if (d.acao === 'vaga'){ document.getElementById('vaga-msg').textContent = 'Neste protótipo a inscrição ainda não está ligada. No app final, este botão leva para o cadastro na Escola.'; return; }
  });
  document.addEventListener('input', e => {
    const el = e.target, d = el.dataset;
    if (d.num){ const v = el.value.replace(/[^\d,]/g, '').replace(',', '.'); setPath(d.num, v === '' ? '' : Number(v)); salvar();
      const P = S.perfil, btn = document.querySelector('button[data-go="numeros"]');
      if (btn && S.etapa === 'perfil') btn.disabled = !(P.clt && P.guardado && P.meses && P.limite); }
    if (d.txt){ setPath(d.txt, el.value); salvar(); }
    if (d.busca){ S[d.busca] = el.value; if (d.busca === 'buscaMun'){ S.mun = (MUNICIPIOS[S.uf] || []).find(m => norm(m) === norm(el.value.trim())) || ''; document.getElementById('resMun').innerHTML = resultadosMun(listaMunicipios()); }
      else document.getElementById('resNeg').innerHTML = resultadosNeg(listaNegocios()); salvar(); }
  });
  document.addEventListener('change', e => { const d = e.target.dataset; if (d.sel){ setPath(d.sel, e.target.value); if (d.sel === 'uf'){ S.mun = ''; S.buscaMun = ''; } render(); } });
  render();
})();
</script>
</body>
</html>
