# Render Blueprint: publica a API de dados e o web app juntos.
# No Render: New > Blueprint > repositório wiltonds/lab-product-launch.
services:
  - type: web
    name: lab-dados-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"   # depois do primeiro deploy, troque pelo endereço do web app

  - type: web
    name: lab-do-meu-negocio
    runtime: static
    rootDir: webapp
    buildCommand: pnpm exec expo export --platform web --output-dir dist --clear
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # endereço PÚBLICO da API (ex.: https://lab-dados-api.onrender.com).
      # O "host" do fromService é o endereço interno do Render e não funciona no navegador.
      - key: EXPO_PUBLIC_INSIGHTS_API_URL
        sync: false
    routes:
      - { type: rewrite, source: /onboarding, destination: /onboarding.html }
      - { type: rewrite, source: /simulator, destination: /simulator.html }
      - { type: rewrite, source: /missions, destination: /missions.html }
      - { type: rewrite, source: /profile, destination: /profile.html }
      - { type: rewrite, source: /report, destination: /report.html }
      - { type: rewrite, source: /mentorship, destination: /mentorship.html }
      - { type: rewrite, source: /privacy, destination: /privacy.html }
      - { type: rewrite, source: /sales-test, destination: /sales-test.html }
